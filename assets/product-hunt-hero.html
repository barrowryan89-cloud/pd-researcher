<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 1200px;
            height: 630px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            overflow: hidden;
            position: relative;
        }
        .grid {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(rgba(94, 129, 172, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(94, 129, 172, 0.1) 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.5;
        }
        .content {
            z-index: 10;
            text-align: center;
            padding: 40px;
        }
        .badge {
            display: inline-block;
            background: rgba(0, 255, 136, 0.15);
            border: 1px solid rgba(0, 255, 136, 0.3);
            color: #00ff88;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 24px;
        }
        h1 {
            font-size: 72px;
            font-weight: 800;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #fff 0%, #a8d8ea 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.1;
        }
        .subtitle {
            font-size: 28px;
            color: #88c0d0;
            margin-bottom: 32px;
            font-weight: 400;
        }
        .features {
            display: flex;
            gap: 40px;
            justify-content: center;
            margin-bottom: 40px;
        }
        .feature {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 20px;
            color: #d8dee9;
        }
        .feature-icon {
            width: 32px;
            height: 32px;
            background: rgba(0, 255, 136, 0.2);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }
        .code-block {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(94, 129, 172, 0.3);
            border-radius: 12px;
            padding: 20px 32px;
            font-family: 'Fira Code', 'Monaco', monospace;
            font-size: 18px;
            color: #00ff88;
            display: inline-block;
        }
        .code-block span {
            color: #5e81ac;
        }
        .tools-preview {
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 16px;
            opacity: 0.15;
        }
        .tool-card {
            width: 140px;
            height: 100px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>
    <div class="grid"></div>
    <div class="content">
        <div class="badge">Open Source</div>
        <h1>98 CLI Tools</h1>
        <p class="subtitle">Zero Dependencies. Copy. Paste. Run.</p>
        <div class="features">
            <div class="feature">
                <div class="feature-icon">⚡</div>
                <span>Single File</span>
            </div>
            <div class="feature">
                <div class="feature-icon">🔒</div>
                <span>No pip install</span>
            </div>
            <div class="feature">
                <div class="feature-icon">🚀</div>
                <span>MIT Licensed</span>
            </div>
        </div>
        <div class="code-block">
            <span>$</span> python3 password_gen_free.py --length 32
        </div>
    </div>
    <div class="tools-preview">
        <div class="tool-card">🔐 password_gen</div>
        <div class="tool-card">🌐 port_scanner</div>
        <div class="tool-card">📊 json_formatter</div>
        <div class="tool-card">🧹 html_cleaner</div>
        <div class="tool-card">📈 log_analyzer</div>
    </div>
</body>
</html>
