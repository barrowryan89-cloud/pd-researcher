<!DOCTYPE html>
<html>
<head>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { 
    width: 2400px; 
    height: 1800px; 
    background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
    color: #c9d1d9;
}
.headline {
    font-size: 180px;
    font-weight: 800;
    color: #58a6ff;
    text-align: center;
    line-height: 1.1;
    margin-bottom: 60px;
}
.subhead {
    font-size: 72px;
    color: #8b949e;
    text-align: center;
    margin-bottom: 100px;
}
.features {
    display: flex;
    gap: 40px;
    font-size: 36px;
}
.feature {
    background: rgba(88, 166, 255, 0.1);
    padding: 30px 50px;
    border-radius: 12px;
    border: 2px solid #58a6ff;
}
.terminal {
    margin-top: 80px;
    background: #0d1117;
    border: 3px solid #30363d;
    border-radius: 16px;
    padding: 40px 60px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 42px;
}
.prompt { color: #58a6ff; }
.command { color: #c9d1d9; }
.output { color: #7ee787; margin-top: 20px; }
</style>
</head>
<body>
    <div class="headline">60+ Free CLI Tools</div>
    <div class="subhead">Zero Dependencies. Copy. Paste. Run.</div>
    <div class="features">
        <div class="feature">Python 3</div>
        <div class="feature">MIT License</div>
        <div class="feature">Single Files</div>
    </div>
    <div class="terminal">
        <span class="prompt">$</span> <span class="command">python3 password_gen_free.py 20</span><br>
        <span class="output">→ k9#mP2$vLq8!nX5@aB1z</span>
    </div>
</body>
</html>
